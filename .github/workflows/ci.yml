name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      GEMINI_API_KEY: ""
      ALLOW_GEMINI_DOCUMENT_CONTEXT: "false"
      RUN_GEMINI_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.check_publication
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m scripts.validate_offline

  retrieval-evaluation:
    # Real model downloads are explicit; ordinary CI uses deterministic doubles.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.evaluate_retrieval
      - run: python -m scripts.evaluate_quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-evaluation
          path: data/evaluation/*.json
